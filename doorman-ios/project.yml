# XcodeGen spec. Doorman.xcodeproj is generated from this file:
#   brew install xcodegen && xcodegen generate
# Before running on a device, set DEVELOPMENT_TEAM below (or in Xcode,
# Signing & Capabilities). If you change the bundle prefix, also change the
# App Group in every *.entitlements entry here and in Shared/Core/AppGroup.swift.
name: Doorman

options:
  bundleIdPrefix: com.doorman
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  Doorman:
    type: application
    platform: iOS
    sources:
      - path: Doorman
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.doorman.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: Doorman/Info.plist
      properties:
        CFBundleDisplayName: Doorman
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSSupportsLiveActivities: true
        NSCalendarsFullAccessUsageDescription: Doorman shows your next event on the block screen, for example "Deck review in 47 min". Your calendar never leaves your iPhone.
        CFBundleURLTypes:
          - CFBundleURLName: com.doorman.app
            CFBundleURLSchemes:
              - doorman
    entitlements:
      path: Doorman/Doorman.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups:
          - group.com.doorman.app
    dependencies:
      - target: DoormanMonitor
      - target: DoormanShieldConfig
      - target: DoormanShieldAction
      - target: DoormanWidgets

  DoormanMonitor:
    type: app-extension
    platform: iOS
    sources:
      - path: DoormanMonitor
      - path: Shared/Core
      - path: Shared/Shielding
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.doorman.app.monitor
    info:
      path: DoormanMonitor/Info.plist
      properties:
        CFBundleDisplayName: Doorman Monitor
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.deviceactivity.monitor-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).DoormanMonitor
    entitlements:
      path: DoormanMonitor/DoormanMonitor.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups:
          - group.com.doorman.app

  DoormanShieldConfig:
    type: app-extension
    platform: iOS
    sources:
      - path: DoormanShieldConfig
      - path: Shared/Core
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.doorman.app.shieldconfig
    info:
      path: DoormanShieldConfig/Info.plist
      properties:
        CFBundleDisplayName: Doorman Shield
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.ManagedSettingsUI.shield-configuration-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShieldConfigurationExtension
    entitlements:
      path: DoormanShieldConfig/DoormanShieldConfig.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups:
          - group.com.doorman.app

  DoormanShieldAction:
    type: app-extension
    platform: iOS
    sources:
      - path: DoormanShieldAction
      - path: Shared/Core
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.doorman.app.shieldaction
    info:
      path: DoormanShieldAction/Info.plist
      properties:
        CFBundleDisplayName: Doorman Shield Action
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.ManagedSettings.shield-action-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShieldActionExtension
    entitlements:
      path: DoormanShieldAction/DoormanShieldAction.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups:
          - group.com.doorman.app

  DoormanWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: DoormanWidgets
      - path: Shared/Core
      - path: Shared/LiveActivity
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.doorman.app.widgets
    info:
      path: DoormanWidgets/Info.plist
      properties:
        CFBundleDisplayName: Doorman Widgets
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: DoormanWidgets/DoormanWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.doorman.app

schemes:
  Doorman:
    build:
      targets:
        Doorman: all
    run:
      config: Debug
    archive:
      config: Release
